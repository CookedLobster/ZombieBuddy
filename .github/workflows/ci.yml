name: CI

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  authors:
    name: Author list signature
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: Verify authors.json Ed25519 signature
        run: python3 lib/verify_authors.py authors.json

  installer:
    name: Installer (Go)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: installer
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-go@7b8cf10d4e4a01d4992d18a89f4d7dc5a3e6d6f4 # v5
        with:
          go-version: '1.25.5'
          cache-dependency-path: installer/go.sum
      - run: go vet ./...
      - run: go test ./...

  build-config:
    name: Gradle configuration and verification
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: java
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4
        with:
          distribution: temurin
          java-version: '25'
      - uses: gradle/actions/setup-gradle@ed408507eac070d1f99cc633dbcf757c94c7933a # v4
        with:
          gradle-version: '9.8.0'
      - name: Resolve plugins and verify dependency metadata
        run: gradle help --console=plain
      - name: Verify wrapper checksum pin
        run: grep -q '^distributionSha256Sum=' gradle/wrapper/gradle-wrapper.properties

  # Full Java compilation and tests require the proprietary Project Zomboid JAR.
  # Configure a self-hosted runner (or provide PZ_CLASSPATH) to run:
  #   gradle -PjavaVersion=25 -PgameClasspath="$PZ_CLASSPATH" \
  #     compileJava compilePatchesJava compileExperimentalJava unitTest test_vanilla

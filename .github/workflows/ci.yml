name: CI

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  installer:
    name: Installer (Go)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: installer
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.25.5'
          cache-dependency-path: installer/go.sum
      - run: go test ./...

  build-config:
    name: Gradle configuration and verification
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: java
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '25'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.8.0'
      - name: Resolve plugins and verify dependency metadata
        run: gradle help --console=plain
      - name: Verify wrapper checksum pin
        run: grep -q '^distributionSha256Sum=' gradle/wrapper/gradle-wrapper.properties

  # Full Java compilation and tests require the proprietary Project Zomboid JAR.
  # Configure a self-hosted runner (or provide PZ_CLASSPATH) to run:
  #   gradle -PjavaVersion=25 -PgameClasspath="$PZ_CLASSPATH" \
  #     compileJava compilePatchesJava compileExperimentalJava unitTest test_vanilla
